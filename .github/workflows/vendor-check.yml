name: vendor-check

# vendor/relay is written only by the sync pull request from the RSVP repository.
# This runs on every pull request (no path filter) so it can be a required check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      # Uses only Node built-ins, so no install is needed.
      - name: Verify vendor/relay against SOURCE.json
        run: node scripts/verify-vendor.mjs

      # The RSVP repository is private, so this repository cannot fetch it to prove
      # a sha is real. Instead, vendor/relay may only change on the branch that the
      # RSVP relay-sync workflow pushes (with FAVOR_PRINTER_SYNC_TOKEN) in this repo.
      # Together with the hash check above, a hand edit cannot get in.
      - name: Accept vendor/relay changes only from the sync branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- vendor/relay)"
          if [ -z "${changed}" ]; then
            echo "vendor/relay is unchanged."
            exit 0
          fi
          if [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] && [ "${HEAD_REF}" = "sync/relay-from-rsvp" ]; then
            echo "vendor/relay changed on ${HEAD_REPO}:${HEAD_REF}, the sync branch."
            exit 0
          fi
          echo "::error::vendor/relay changed on ${HEAD_REPO}:${HEAD_REF}. Changes are accepted only from the sync/relay-from-rsvp branch of ${GITHUB_REPOSITORY}, pushed by the RSVP relay-sync workflow. Do not edit vendor/relay by hand."
          printf '%s\n' "${changed}"
          exit 1
