name: vendor-check

# vendor/relay is written only by the sync pull request from the RSVP repository.
# This runs on every pull request and every push to main (no path filter) so it can
# be a required check. The expensive comparison with the RSVP repository runs only
# when vendor/relay/** changed.
#
# Required secret: RSVP_READ_TOKEN, a fine-grained personal access token with
# Contents: read on favorchurch/rsvp.favor.church only (see docs/RELEASING.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      # Uses only Node built-ins, so no install is needed.
      - name: Verify vendor/relay against SOURCE.json
        run: node scripts/verify-vendor.mjs

      - name: Detect changes under vendor/relay
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            files="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- vendor/relay)"
            [ -n "${files}" ] || changed=false
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "${PUSH_BEFORE}" HEAD -- vendor/relay)"
            [ -n "${files}" ] || changed=false
          fi
          # A push whose previous commit is unknown (new branch, force push) counts as changed.
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "vendor/relay changed: ${changed}"

      # The RSVP repository is private. This step fetches it at the commit recorded
      # in SOURCE.json and requires vendor/relay to equal that commit's relay runtime
      # files byte for byte. It never trusts the hashes or the sha in SOURCE.json by
      # themselves, so a hand edit that refreshes them cannot pass.
      - name: Compare vendor/relay with the RSVP commit in SOURCE.json
        if: steps.changes.outputs.changed == 'true'
        env:
          RSVP_READ_TOKEN: ${{ secrets.RSVP_READ_TOKEN }}
          RSVP_REPOSITORY: favorchurch/rsvp.favor.church
        run: |
          set -euo pipefail

          if [ -z "${RSVP_READ_TOKEN}" ]; then
            echo "::error::vendor/relay changed but RSVP_READ_TOKEN is not available, so it cannot be compared with ${RSVP_REPOSITORY}. This happens on pull requests from forks and when the secret is not set. Failing closed."
            exit 1
          fi

          sha="$(node -p "require('./vendor/relay/SOURCE.json').sha")"
          repo="$(node -p "require('./vendor/relay/SOURCE.json').repo")"
          if [ "${repo}" != "${RSVP_REPOSITORY}" ]; then
            echo "::error::SOURCE.json repo is '${repo}', expected ${RSVP_REPOSITORY}."
            exit 1
          fi
          case "${sha}" in
            *[!0-9a-f]* | "") echo "::error::SOURCE.json sha is not a lowercase hex commit sha."; exit 1 ;;
          esac
          [ "${#sha}" -eq 40 ] || { echo "::error::SOURCE.json sha is not 40 characters."; exit 1; }

          # The token goes in an HTTP header set through the environment, not in a URL
          # or in argv, and the header value is masked in case anything prints it.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${RSVP_READ_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${header}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="${header}"
          export GIT_TERMINAL_PROMPT=0

          rsvp_dir="${RUNNER_TEMP}/rsvp-source"
          rm -rf "${rsvp_dir}" && mkdir -p "${rsvp_dir}"
          git -C "${rsvp_dir}" init -q
          if ! git -C "${rsvp_dir}" fetch -q --depth=1 --no-tags \
                "https://github.com/${RSVP_REPOSITORY}" "${sha}" 2>/dev/null; then
            echo "::error::Commit ${sha} (from SOURCE.json) could not be fetched from ${RSVP_REPOSITORY}. It does not exist there, or RSVP_READ_TOKEN cannot read the repository."
            exit 1
          fi
          git -C "${rsvp_dir}" checkout -q --detach FETCH_HEAD
          [ "$(git -C "${rsvp_dir}" rev-parse HEAD)" = "${sha}" ] || { echo "::error::Fetched commit does not match ${sha}."; exit 1; }

          VENDOR_DIR="vendor/relay" SOURCE_DIR="${rsvp_dir}/relay" node - <<'JS'
          // Same file selection as scripts/sync-relay-to-favor-printer.mjs in the RSVP
          // repository: the files that embedded.ts and index.ts reach by following
          // relative imports. Tests, packaging, docs and the simulator are not imported,
          // so they are not part of the snapshot.
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { builtinModules } = require("node:module");

          const vendorDir = path.resolve(process.env.VENDOR_DIR);
          const sourceDir = path.resolve(process.env.SOURCE_DIR);
          const ENTRY_POINTS = ["embedded.ts", "index.ts"];
          const MANIFEST = "SOURCE.json";
          const problems = [];

          const posix = (p) => p.split(path.sep).join("/");
          const sha256 = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
          const builtins = new Set(builtinModules);
          const FROM_IMPORT = /(?:^|\n)[ \t]*(?:import|export)\s[^;'"]*?\sfrom\s*["']([^"']+)["']/g;
          const BARE_IMPORT = /(?:^|\n)[ \t]*import\s*["']([^"']+)["']/g;
          const DYNAMIC_IMPORT = /(?:^|[^.\w])import\(\s*["']([^"']+)["']\s*\)/g;

          const specifiersOf = (text) => {
            const found = new Set();
            for (const pattern of [FROM_IMPORT, BARE_IMPORT, DYNAMIC_IMPORT]) {
              for (const match of text.matchAll(pattern)) found.add(match[1]);
            }
            return [...found].sort();
          };
          const isInside = (root, candidate) => {
            const relative = path.relative(root, candidate);
            return relative !== "" && !relative.startsWith("..") && !path.isAbsolute(relative);
          };
          const isFile = (p) => fs.existsSync(p) && fs.statSync(p).isFile();

          // 1. The runtime files at the RSVP commit.
          const runtime = new Set();
          const queue = ENTRY_POINTS.map((entry) => path.join(sourceDir, entry));
          while (queue.length > 0) {
            const file = queue.pop();
            const name = posix(path.relative(sourceDir, file));
            if (runtime.has(name)) continue;
            if (!isFile(file)) {
              problems.push(`${name}: needed by the relay entry points but missing at the RSVP commit`);
              continue;
            }
            if (fs.lstatSync(file).isSymbolicLink()) {
              problems.push(`${name}: is a symlink at the RSVP commit`);
              continue;
            }
            runtime.add(name);
            for (const specifier of specifiersOf(fs.readFileSync(file, "utf8"))) {
              if (specifier.startsWith("./") || specifier.startsWith("../")) {
                const base = path.resolve(path.dirname(file), specifier);
                if (!isInside(sourceDir, base)) {
                  problems.push(`${name}: imports "${specifier}", which is outside relay/`);
                  continue;
                }
                const target = [base, `${base}.ts`, path.join(base, "index.ts")].find(isFile);
                if (target) queue.push(target);
                else problems.push(`${name}: imports "${specifier}", which does not exist`);
              } else if (!specifier.startsWith("node:") && !builtins.has(specifier)) {
                problems.push(`${name}: imports "${specifier}", which is not a Node built-in`);
              }
            }
          }
          const expected = new Map();
          for (const name of [...runtime].sort()) {
            expected.set(name, fs.readFileSync(path.join(sourceDir, name)));
          }

          // 2. vendor/relay must hold exactly those files, byte for byte.
          const listFiles = (dir, prefix = "") =>
            fs.readdirSync(path.join(dir, prefix), { withFileTypes: true }).flatMap((entry) => {
              const relative = prefix ? `${prefix}/${entry.name}` : entry.name;
              return entry.isDirectory() ? listFiles(dir, relative) : [relative];
            });
          const vendored = listFiles(vendorDir).filter((name) => name !== MANIFEST);
          for (const name of vendored) {
            if (!expected.has(name)) problems.push(`${name}: in vendor/relay but not a relay runtime file at the RSVP commit`);
          }
          for (const [name, bytes] of expected) {
            if (!vendored.includes(name)) {
              problems.push(`${name}: a relay runtime file at the RSVP commit but missing from vendor/relay`);
            } else if (!fs.readFileSync(path.join(vendorDir, name)).equals(bytes)) {
              problems.push(`${name}: differs from the RSVP commit`);
            }
          }

          // 3. SOURCE.json hashes, recomputed from the fetched tree.
          const manifest = JSON.parse(fs.readFileSync(path.join(vendorDir, MANIFEST), "utf8"));
          const recorded = manifest.files ?? {};
          for (const [name, bytes] of expected) {
            const hash = sha256(bytes);
            if (recorded[name] !== hash) problems.push(`${name}: SOURCE.json hash is not ${hash} (the hash at the RSVP commit)`);
          }
          for (const name of Object.keys(recorded)) {
            if (!expected.has(name)) problems.push(`${name}: listed in SOURCE.json but not a relay runtime file at the RSVP commit`);
          }

          if (problems.length > 0) {
            console.error("vendor/relay does not match the RSVP commit recorded in SOURCE.json:");
            for (const problem of problems) console.error(`::error::${problem}`);
            process.exit(1);
          }
          console.log(`vendor/relay matches ${manifest.repo}@${manifest.sha}: ${expected.size} runtime files, byte for byte.`);
          JS

      # Extra check, not the guarantee: vendor/relay may also only change on the branch
      # that the RSVP relay-sync workflow pushes (with FAVOR_PRINTER_SYNC_TOKEN) in
      # this repository.
      - name: Accept vendor/relay changes only from the sync branch
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed == 'true'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] && [ "${HEAD_REF}" = "sync/relay-from-rsvp" ]; then
            echo "vendor/relay changed on ${HEAD_REPO}:${HEAD_REF}, the sync branch."
            exit 0
          fi
          echo "::error::vendor/relay changed on ${HEAD_REPO}:${HEAD_REF}. Changes are accepted only from the sync/relay-from-rsvp branch of ${GITHUB_REPOSITORY}, pushed by the RSVP relay-sync workflow. Do not edit vendor/relay by hand."
          exit 1
