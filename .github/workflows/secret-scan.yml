name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run the free, MIT-licensed gitleaks CLI directly. The gitleaks-action
      # wrapper requires a paid GITLEAKS_LICENSE for organization-owned repos,
      # but the binary itself is free — so we install and run it ourselves
      # (same pattern as favorchurch/rock-mcp).
      #
      # `gitleaks dir` scans the working tree only, not git history — no
      # `fetch-depth: 0` is needed. This is deliberate, not a shortcut: some
      # of these repos have a since-rotated credential still sitting in old
      # git history that will never be rewritten out, so a history scan
      # (`gitleaks detect`) would be permanently red here. A permanently red
      # guard gets ignored, which is worse than no guard — scanning only what
      # someone is about to commit is what actually catches the next one.
      #
      # The downloaded tarball is verified against a pinned SHA-256 BEFORE it is
      # unpacked or executed, so a tampered/substituted release cannot run code
      # in CI. Bump GITLEAKS_VERSION and GITLEAKS_SHA256 together (the checksum
      # is published at .../releases/download/v<ver>/gitleaks_<ver>_checksums.txt).
      - name: Run Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks dir . --redact --verbose --exit-code 1
