name: release

# A pushed tag builds, signs and notarizes the app and uploads it to a DRAFT
# GitHub release. Nothing here publishes a release. A maintainer publishes the
# draft by hand after an explicit OK (see docs/RELEASING.md).
#
#   v1.2.3            stable
#   v1.2.3-preview.4  preview

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+"

permissions:
  contents: write # create and fill the draft release, nothing else

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    # Put the secrets below in this environment and add required reviewers to it,
    # so a signed build waits for a maintainer to approve the run.
    environment: release
    env:
      TAG: ${{ github.ref_name }}
      KEYCHAIN_NAME: favor-printer-release.keychain-db
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi
          case "${version}" in
            *-preview.*) echo "Channel: preview (prerelease)" ;;
            *-*) echo "::error::Unsupported prerelease suffix in ${version}. Use -preview.N."; exit 1 ;;
            *) echo "Channel: stable" ;;
          esac

      # A draft release is the only thing this workflow may create. Refuse to
      # touch a release for this tag that a maintainer has already published.
      - name: Check the release for this tag is not already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == false) | .html_url")"
          if [ -n "${published}" ]; then
            echo "::error::A published release already exists for ${TAG}: ${published}. Roll forward with a higher version instead."
            exit 1
          fi

      - name: Check the signing and notarization secrets are set
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
                      APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is not set."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify vendor, lint, typecheck and test
        run: |
          set -euo pipefail
          pnpm verify:vendor
          pnpm lint
          pnpm typecheck
          pnpm test

      # The certificate lives in a keychain created for this run and deleted at
      # the end. The p12 password only ever appears in this step's environment:
      # openssl reads it from the variable (-passin env:), and security import
      # gets unencrypted PEM files, so the password never lands in any argv.
      - name: Import the signing certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/${KEYCHAIN_NAME}"
          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          p12_path="${RUNNER_TEMP}/signing-certificate.p12"
          cert_pem="${RUNNER_TEMP}/signing-certificate.pem"
          key_pem="${RUNNER_TEMP}/signing-key.pem"

          # Record paths first so the cleanup step still works if a later command fails.
          echo "KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"
          echo "P12_PATH=${p12_path}" >> "${GITHUB_ENV}"
          echo "CERT_PEM_PATH=${cert_pem}" >> "${GITHUB_ENV}"
          echo "KEY_PEM_PATH=${key_pem}" >> "${GITHUB_ENV}"
          security list-keychains -d user | tr -d '"' | xargs > "${RUNNER_TEMP}/keychain-search-list.txt"

          umask 077
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${p12_path}"

          # Temporary unencrypted copies, deleted below and again by the cleanup step.
          openssl pkcs12 -in "${p12_path}" -passin env:MACOS_CERTIFICATE_PASSWORD \
            -clcerts -nokeys -out "${cert_pem}"
          openssl pkcs12 -in "${p12_path}" -passin env:MACOS_CERTIFICATE_PASSWORD \
            -nocerts -nodes -out "${key_pem}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_pem}" -f openssl -t cert -k "${keychain_path}"
          security import "${key_pem}" -f openssl -t priv -k "${keychain_path}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "${keychain_path}" $(cat "${RUNNER_TEMP}/keychain-search-list.txt")

          rm -f "${p12_path}" "${cert_pem}" "${key_pem}"

          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in the imported certificate."
            exit 1
          fi

      - name: Write the notarization API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"
          (umask 077 && printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${key_path}")

      # Same settings as electron-builder.yml, plus draft-only publishing and a
      # signed DMG so it can be notarized, stapled and assessed on its own.
      - name: Write the release builder config
        run: |
          cat > electron-builder.release.yml <<'YAML'
          extends: ./electron-builder.yml
          publish:
            provider: github
            owner: favorchurch
            repo: favor-printer
            releaseType: draft
          dmg:
            sign: true
          YAML

      # electron-builder signs the app with the keychain identity and, because the
      # API key variables are set, notarizes and staples the app with notarytool.
      - name: Build, sign and notarize the app
        env:
          CSC_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          pnpm build
          pnpm exec electron-builder --config electron-builder.release.yml --publish never

      - name: Notarize and staple the DMGs
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          [ "${#dmgs[@]}" -gt 0 ] || { echo "::error::No DMG was built."; exit 1; }
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing ${dmg}"
            result="$(xcrun notarytool submit "${dmg}" \
              --key "${APPLE_API_KEY}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}" \
              --wait --timeout 30m --output-format json)"
            status="$(printf '%s' "${result}" | jq -r '.status')"
            if [ "${status}" != "Accepted" ]; then
              echo "::error::Notarization of ${dmg} ended as '${status}'. Fetch the log with 'xcrun notarytool log' and the submission id."
              printf '%s' "${result}" | jq -r '"submission id: \(.id)"'
              exit 1
            fi
            xcrun stapler staple "${dmg}"
            xcrun stapler validate "${dmg}"
          done

      # Stapling rewrites the DMG, so the checksum and size recorded for it in
      # latest-mac.yml are stale. Refresh them. The zip is untouched.
      - name: Refresh the DMG entries in the update manifest
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const manifest = fs.readdirSync("release").find((f) => /-mac\.yml$/.test(f) && f !== "builder-effective-config.yaml");
          if (!manifest) throw new Error("no *-mac.yml in release/");
          const file = path.join("release", manifest);
          let refreshed = 0;
          const text = fs
            .readFileSync(file, "utf8")
            .replace(/(- url: (\S+\.dmg)\n\s+sha512: )(\S+)(\n\s+size: )(\d+)/g, (_m, head, name, _sha, mid) => {
              const bytes = fs.readFileSync(path.join("release", name));
              refreshed += 1;
              return `${head}${crypto.createHash("sha512").update(bytes).digest("base64")}${mid}${bytes.length}`;
            });
          const dmgCount = fs.readdirSync("release").filter((f) => f.endsWith(".dmg")).length;
          if (refreshed !== dmgCount) throw new Error(`refreshed ${refreshed} DMG entries, expected ${dmgCount}`);
          fs.writeFileSync(file, text);
          console.log(`${manifest}: refreshed ${refreshed} DMG entries`);
          JS

      - name: Verify signatures, notarization and Gatekeeper
        run: |
          set -euo pipefail
          shopt -s nullglob
          work="${RUNNER_TEMP}/verify"
          rm -rf "${work}" && mkdir -p "${work}"

          verify_app() {
            app="$1"
            codesign --verify --deep --strict --verbose=2 "${app}"
            spctl --assess --type execute --verbose=4 "${app}"
            xcrun stapler validate "${app}"
          }

          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "${dmg}"
            spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg}"
            xcrun stapler validate "${dmg}"
            mount="${work}/mount-$(basename "${dmg}")"
            mkdir -p "${mount}"
            hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "${dmg}" > /dev/null
            status=0
            verify_app "${mount}/Favor Printer.app" || status=$?
            hdiutil detach "${mount}" > /dev/null
            [ "${status}" -eq 0 ] || exit "${status}"
          done

          for zip in release/*.zip; do
            dest="${work}/zip-$(basename "${zip}" .zip)"
            mkdir -p "${dest}"
            ditto -x -k "${zip}" "${dest}"
            verify_app "${dest}/Favor Printer.app"
          done

      # electron-builder uploads to the GitHub release for this tag. releaseType is
      # draft in the config and EP_DRAFT backs it up. The DMG blockmaps are skipped:
      # stapling made them stale and the updater only uses the zip. The build and
      # notarization above take a long time, so the "not published" check from the
      # start is repeated here, in the same step, immediately before the upload.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EP_DRAFT: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == false) | .html_url")"
          if [ -n "${published}" ]; then
            echo "::error::${TAG} was published while this run was building (${published}). Nothing was uploaded. Roll forward with a higher version instead."
            exit 1
          fi
          files=()
          for f in release/*.dmg release/*.zip release/*.zip.blockmap release/*-mac.yml; do
            files+=(--files "${f}")
          done
          pnpm exec electron-builder publish --config electron-builder.release.yml "${files[@]}"

      - name: Check the release is still a draft with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\")" | jq -s '.[0]')"
          if [ -z "${release}" ] || [ "${release}" = "null" ]; then
            echo "::error::No release found for ${TAG}."
            exit 1
          fi
          if [ "$(printf '%s' "${release}" | jq -r '.draft')" != "true" ]; then
            echo "::error::The release for ${TAG} is not a draft. Unpublish it now: gh release edit ${TAG} --draft"
            exit 1
          fi
          names="$(printf '%s' "${release}" | jq -r '.assets[].name')"
          for pattern in 'arm64\.dmg$' 'x64\.dmg$' 'arm64\.zip$' 'x64\.zip$' '-mac\.yml$'; do
            printf '%s\n' "${names}" | grep -Eq "${pattern}" || { echo "::error::Release is missing an asset matching ${pattern}."; exit 1; }
          done
          echo "Draft release for ${TAG} is ready for a maintainer to review and publish."

      # Runs even when an earlier step failed.
      - name: Remove the temporary keychain and key files
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
          if [ -f "${RUNNER_TEMP}/keychain-search-list.txt" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "${RUNNER_TEMP}/keychain-search-list.txt") || true
          fi
          rm -f "${P12_PATH:-}" "${CERT_PEM_PATH:-}" "${KEY_PEM_PATH:-}" "${APPLE_API_KEY:-}" "${RUNNER_TEMP}/keychain-search-list.txt" electron-builder.release.yml
