name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Unsigned build: no signing identity and no notarization credentials are
      # present, so electron-builder skips both. This job never reads a secret.
      - name: Build (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm dist

      - name: Check build output
        run: |
          set -euo pipefail
          for pattern in "release/Favor-Printer-*-arm64.dmg" "release/Favor-Printer-*-x64.dmg" \
                         "release/Favor-Printer-*-arm64.zip" "release/Favor-Printer-*-x64.zip"; do
            # shellcheck disable=SC2086
            ls $pattern > /dev/null || { echo "::error::No artifact matches $pattern"; exit 1; }
          done
          # electron-builder names the manifest after the channel of the version:
          # latest-mac.yml for a stable version, <suffix>-mac.yml for a prerelease
          # such as 1.2.3-beta.4 (beta-mac.yml).
          version="$(node -p "require('./package.json').version")"
          case "${version}" in
            *-*) suffix="${version#*-}"; manifest="release/${suffix%%.*}-mac.yml" ;;
            *) manifest="release/latest-mac.yml" ;;
          esac
          test -f "${manifest}" || { echo "::error::Missing update manifest ${manifest} for version ${version}."; ls release/*-mac.yml || true; exit 1; }

  # Windows host is separate from the existing macOS gate. Unsigned installer
  # checks here are NOT physical Zebra acceptance or production release approval.
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Vendor, types and tests
        run: |
          pnpm verify:vendor
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build unsigned Windows x64 host
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Inspect Windows app and bundled PowerShell helpers
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/win-unpacked/resources/windows/probe-printers.ps1')) { throw 'missing Windows discovery helper' }
          if (-not (Test-Path 'release/win-unpacked/resources/windows/print-raw.ps1')) { throw 'missing Windows spooler helper' }
          $installers = @(Get-ChildItem -Path 'release' -Filter 'Favor-Printer-*.exe' -File)
          if ($installers.Count -lt 1) { throw 'missing Windows NSIS installer' }
