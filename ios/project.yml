name: FavorPrinter

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:
  FavorPrinter:
    type: application
    platform: iOS
    sources:
      - path: FavorPrinter
        excludes:
          - FavorPrinter.entitlements
    dependencies:
      # The dext is embedded where installd looks for it on iOS: <App>.app/SystemExtensions. DriverExtensions/
      # installs but is ignored.
      - target: FavorPrinterDriver
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(SYSTEM_EXTENSIONS_FOLDER_PATH)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FavorPrinter/FavorPrinter.entitlements
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "IOKit"]
        SWIFT_OBJC_BRIDGING_HEADER: FavorPrinter/Bridging-Header.h
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 3JJ4492TV8
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Favor Printer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: church.favor.printer.ios
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "2"

  FavorPrinterDriver:
    type: driver-extension
    platform: iOS
    sources:
      - path: FavorPrinterDriver
        excludes:
          - Info.plist
          - FavorPrinterDriver.entitlements
    settings:
      base:
        # The simulator cannot load a dext and no DriverKit profile exists for it, so a simulator destination builds
        # the dext unsigned. TARGET_DEVICE_PLATFORM_NAME is empty for generic device destinations, hence the empty default.
        CODE_SIGNING_ALLOWED: "$(DEXT_SIGNING_ALLOWED_$(TARGET_DEVICE_PLATFORM_NAME))"
        DEXT_SIGNING_ALLOWED_: "YES"
        DEXT_SIGNING_ALLOWED_iphoneos: "YES"
        DEXT_SIGNING_ALLOWED_iphonesimulator: "NO"
        CODE_SIGN_ENTITLEMENTS: FavorPrinterDriver/FavorPrinterDriver.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 3JJ4492TV8
        DRIVERKIT_DEPLOYMENT_TARGET: "22.0"
        INFOPLIST_FILE: FavorPrinterDriver/Info.plist
        MARKETING_VERSION: 0.1.0
        OTHER_LDFLAGS: ["-framework", "DriverKit", "-framework", "USBDriverKit"]
        PRODUCT_BUNDLE_IDENTIFIER: church.favor.printer.ios.driver
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit

  FavorPrinterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FavorPrinterTests
    dependencies:
      - target: FavorPrinter
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 3JJ4492TV8
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: church.favor.printer.ios.tests
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "2"

  FavorPrinterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FavorPrinterUITests
    dependencies:
      - target: FavorPrinter
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 3JJ4492TV8
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: church.favor.printer.ios.uitests
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: FavorPrinter

schemes:
  FavorPrinter:
    build:
      targets:
        FavorPrinter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FavorPrinterTests
        - FavorPrinterUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
